    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css?v=94">
    <link rel="preconnect" href="https://unpkg.com">
    <!-- PhotoSwipe CSS -->
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <a href="/" class="logo">
            <img src="logo.png" alt="QUBLY">
        </a>

        <div class="menu-toggle">
            <div class="hamburger-line"></div>
        </div>
    </header>

    <!-- FULLSCREEN MENU -->
    <div class="fullscreen-menu">
        <ul class="menu-list">
            <li class="menu-item"><a href="/" data-i18n="nav_home">Home</a></li>
            <li class="menu-item"><a href="/about" data-i18n="nav_about">About Us</a></li>
            <li class="menu-item"><a href="/#case-studies" data-i18n="nav_purpose">What We Offer</a></li>
            <li class="menu-item"><a href="/#projects" data-i18n="nav_projects">Projects</a></li>
            <li class="menu-item"><a href="/#contact" data-i18n="nav_contact">Contact Us</a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT WRAPPER -->
    <main id="main-content-wrapper" style="position: relative; overflow: hidden; background-color: var(--bg-color); min-height: 100vh;">
        <!-- SCROLLING TEXTURE BACKGROUND -->
        <img src="Sfondo.webp" id="scrolling-texture" alt="" decoding="async">

        <!-- GALLERY SECTION -->
        <section class="gallery-section pswp-gallery" id="gallery">
            <h2 class="service-title" style="margin-top: 6vw;" data-i18n="proj_interior">INTERIOR</h2>
            
            <div class="masonry-gallery layout-2">
                <!-- IMMAGINI INTERNI: Rinomina i tuoi file come 01.jpg, 02.jpg, ecc. e mettili nella cartella PS/interni/ -->
                <!-- Se il file non esiste, mostrerà l'immagine di default (interior.png) -->
                
                <a href="PS/interni/01.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/01.webp" alt="Render di interni residenziali QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/02.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/02.webp" alt="Visualizzazione fotorealistica di interni QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/03.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/03.webp" alt="Render per design degli spazi interni QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/04.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/04.webp" alt="Visualizzazione di un ambiente interno contemporaneo QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/05.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/05.webp" alt="Interno arredato in rendering fotorealistico QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/06.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/06.webp" alt="Immagine immobiliare per interni QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/07.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/07.webp" alt="Render interno con materiali e luce QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/08.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/08.webp" alt="Visualizzazione architettonica di interni QUBLY" loading="lazy" decoding="async" />
                </a>
                <a href="PS/interni/09.jpg" target="_blank" class="masonry-item">
                    <img src="PS/interni/09.webp" alt="Render di ambiente interno QUBLY" loading="lazy" decoding="async" />
                </a>
            </div>
        </section>

        <!-- PROJECT LINKS -->
        <section class="project-nav-section" aria-label="Project categories">
            <div class="project-nav-grid">
                <a href="/esterni" class="project-nav-card">
                    <div class="project-nav-media">
                        <img src="PS/exterior.webp" alt="Render esterni QUBLY" loading="lazy" decoding="async">
                    </div>
                    <span data-i18n="proj_exterior">EXTERIOR</span>
                </a>

                <a href="/interni" class="project-nav-card is-current" aria-current="page">
                    <div class="project-nav-media">
                        <img src="PS/interior.webp" alt="Render interni QUBLY" loading="lazy" decoding="async">
                    </div>
                    <span data-i18n="proj_interior">INTERIOR</span>
                </a>

                <a href="/paesaggi" class="project-nav-card">
                    <div class="project-nav-media">
                        <img src="PS/paesaggi.webp" alt="Render paesaggi QUBLY" loading="lazy" decoding="async">
                    </div>
                    <span data-i18n="proj_landscapes">LANDSCAPES</span>

            </div>
        </section>

        <!-- FOOTER -->
        <footer class="site-footer" style="padding: 2vw; border: none; position: relative; z-index: 10;">
            <p style="font-size: 0.8vw; color: #333; margin: 0 auto; text-align: center;">&copy; 2026 QUBLY.</p>
        </footer>
    </main>

    <!-- CUSTOM CURSOR -->
    <div id="cursor-dot" class="custom-cursor"></div>

    <!-- SPOTLIGHT CANVAS -->
    <canvas id="spotlight-canvas"></canvas>

    <!-- JS -->
    <script src="js/translations.js?v=58"></script>
    <script src="js/spotlight.js?v=49"></script>
    <script src="js/main.js?v=74"></script>

    <!-- PHOTOSWIPE SCRIPT -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5.4.3/dist/photoswipe-lightbox.esm.js';
        
        // Auto-calculate image dimensions for PhotoSwipe
        document.querySelectorAll('.masonry-item').forEach(link => {
            const img = link.querySelector('img');
            const setDimensions = () => {
                link.setAttribute('data-pswp-width', img.naturalWidth || 1920);
                link.setAttribute('data-pswp-height', img.naturalHeight || 1080);
            };
            if(img.complete) {
                setDimensions();
            } else {
                img.onload = setDimensions;
            }
        });

        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a.masonry-item',
            pswpModule: () => import('https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.esm.js'),
            showHideAnimationType: 'zoom',
            showAnimationDuration: 700,
            hideAnimationDuration: 700
        });
        lightbox.init();
    </script>
</body>
</html>
