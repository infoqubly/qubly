name: Aggiungi una foto alle gallerie
description: Carica una nuova immagine in Esterni, Interni o Paesaggi.
title: "Nuova foto per la galleria"
body:
  - type: markdown
    attributes:
      value: |
        Questa è la conferma finale. Se arrivi dal [catalogo visivo](https://qubly.studio/gestione-gallerie.html), sezione e titoli sono già compilati. Carica **una sola immagine** e invia il modulo: la foto sarà ottimizzata e pubblicata automaticamente.
  - type: dropdown
    id: sezione
    attributes:
      label: Sezione
      options:
        - Esterni
        - Interni
        - Paesaggi
    validations:
      required: true
  - type: upload
    id: nuova_immagine
    attributes:
      label: Nuova immagine
      description: Scegli un solo file PNG, JPG o WebP, fino a 10 MB e almeno 640 × 400 px.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp"
  - type: input
    id: titolo_it
    attributes:
      label: Titolo italiano
      description: Già compilato dal catalogo. Breve soggetto della foto, visibile nella griglia.
      placeholder: "Villa sul mare"
    validations:
      required: true
  - type: input
    id: titolo_en
    attributes:
      label: Titolo inglese
      description: Già compilato dal catalogo. Nessuna traduzione automatica.
    validations:
      required: true
  - type: input
    id: titolo_sl
    attributes:
      label: Titolo sloveno
      description: Già compilato dal catalogo. Nessuna traduzione automatica.
    validations:
      required: true
