name: Sostituisci una foto della galleria
description: Scegli una foto esistente e carica la sua sostituta.
title: "Sostituzione foto"
body:
  - type: markdown
    attributes:
      value: |
        Questa è la conferma finale. Il [catalogo visivo](https://qubly.studio/gestione-gallerie.html) ha già preparato la foto e i titoli. **Non devi cambiare il titolo della richiesta in alto né la foto selezionata qui sotto.** Carica la nuova immagine e invia il modulo: la sostituzione sarà ottimizzata e pubblicata automaticamente.
  - type: input
    id: foto
    attributes:
      label: Foto selezionata
      description: "Già compilata dal catalogo. Lascia questo codice così: non è il nome della nuova foto."
      placeholder: "reviewed-28"
    validations:
      required: true
  - type: upload
    id: nuova_immagine
    attributes:
      label: Nuova immagine
      description: Scegli un solo file PNG, JPG o WebP, fino a 10 MB e almeno 640 × 400 px.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp"
  - type: input
    id: titolo_it
    attributes:
      label: Titolo italiano
      description: Già compilato dal catalogo. Puoi correggerlo qui se serve.
  - type: input
    id: titolo_en
    attributes:
      label: Titolo inglese
      description: Già compilato dal catalogo. Nessuna traduzione automatica.
  - type: input
    id: titolo_sl
    attributes:
      label: Titolo sloveno
      description: Già compilato dal catalogo. Nessuna traduzione automatica.
