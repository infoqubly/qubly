name: Ottimizza immagini QUBLY

on:
  push:
    branches: [main]
    paths:
      - "**/*.[jJ][pP][gG]"
      - "**/*.[jJ][pP][eE][gG]"
      - "**/*.[pP][nN][gG]"
      - "**/*.[wW][eE][bB][pP]"
      - "**/*.[aA][vV][iI][fF]"
      - "**/*.[sS][vV][gG]"
      - "**/*.[gG][iI][fF]"
      - "**/*.[iI][cC][oO]"
      - "scripts/**"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qubly-site-publication-main
  cancel-in-progress: false
  queue: max

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa il generatore immagini
        run: python -m pip install Pillow==12.3.0

      - name: Genera e pubblica immagini con tentativi automatici
        run: python -B scripts/publish_site.py --mode optimize
