name: Ottimizza immagini QUBLY

on:
  push:
    branches: [main]
    paths:
      - "**/*.[jJ][pP][gG]"
      - "**/*.[jJ][pP][eE][gG]"
      - "**/*.[pP][nN][gG]"
      - "**/*.[wW][eE][bB][pP]"
      - "**/*.[aA][vV][iI][fF]"
      - "**/*.[sS][vV][gG]"
      - "**/*.[gG][iI][fF]"
      - "**/*.[iI][cC][oO]"
      - "scripts/**"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qubly-site-publication-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa il generatore immagini
        run: python -m pip install Pillow==12.3.0

      - name: Genera WebP e aggiorna le gallerie
        run: |
          python -B -m unittest discover -s scripts -p 'test_*.py'
          python -B scripts/optimize_images.py

      - name: Salva i file generati
        shell: bash
        run: |
          git add -A -- PS assets/optimized scripts/image-state.json gallery/catalog.json '*.html' css js
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento necessario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna automaticamente le varianti WebP"
          # Generated HTML must never be rebased onto another gallery order.
          if ! git push origin HEAD:main; then
            echo "::error::main è cambiato durante la pubblicazione. Rilancia questo workflow per rigenerare le gallerie aggiornate."
            exit 1
          fi
