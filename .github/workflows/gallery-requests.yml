name: Aggiorna le gallerie dalle richieste GitHub

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: qubly-site-publication-main
  cancel-in-progress: false
  queue: max

jobs:
  update-gallery:
    if: >-
      contains(github.event.issue.body, '### Nuova immagine') &&
      (contains(github.event.issue.body, '### Sezione') ||
      contains(github.event.issue.body, '### Foto selezionata') ||
      contains(github.event.issue.body, '### ID foto')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa il generatore WebP
        run: python -m pip install Pillow==12.3.0

      - name: Pubblica la richiesta con tentativi automatici
        run: python -B scripts/publish_site.py --mode issue --event "$GITHUB_EVENT_PATH"
