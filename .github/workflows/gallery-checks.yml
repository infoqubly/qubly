name: Verifica gallerie

on:
  pull_request:
    paths:
      - '*.html'
      - gallery/catalog.json
      - scripts/**
      - src/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Installa il generatore immagini
        run: python -m pip install Pillow==12.3.0
      - name: Verifica integrità e pubblicazione delle gallerie
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Verifica salvataggi concorrenti dal tool
        run: node --test src/gallery-api.test.mjs
