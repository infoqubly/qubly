name: Verifica gallerie

on:
  pull_request:
    paths:
      - '*.html'
      - gallery/catalog.json
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Installa il generatore immagini
        run: python -m pip install Pillow==12.3.0
      - name: Verifica integrità e pubblicazione delle gallerie
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
