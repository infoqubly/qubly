name: Pubblica gallerie da QUBLY Tools

on:
  push:
    branches: [main]
    paths:
      - gallery/catalog.json
      - gallery/inbox/**

permissions:
  contents: write

concurrency:
  group: qubly-site-publication-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara il generatore immagini
        run: python -m pip install Pillow==12.3.0

      - name: Pubblica foto e ordine
        run: |
          python scripts/gallery_publish.py
          python -B scripts/optimize_images.py

      - name: Salva il sito aggiornato
        shell: bash
        run: |
          git add -A -- PS assets/optimized scripts/image-state.json gallery '*.html' css js
          if git diff --cached --quiet; then
            echo "Nessuna pagina da aggiornare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pubblica gallerie da QUBLY Tools"
          git pull --rebase origin main
          git push origin HEAD:main
