name: Pubblica gallerie da QUBLY Tools

on:
  push:
    branches: [main]
    paths:
      - gallery/catalog.json
      - gallery/inbox/**
      - scripts/gallery*.py
      - scripts/publish_site.py
      - .github/workflows/gallery-tools.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qubly-site-publication-main
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Prepara il generatore immagini
        run: python -m pip install Pillow==12.3.0

      - name: Pubblica foto e ordine con tentativi automatici
        run: python -B scripts/publish_site.py --mode tools
